services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 6720210042/fitmate-app:main
    container_name: fitmate-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
