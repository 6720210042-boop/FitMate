# ==============================================================================
# Nginx Configuration สำหรับโปรเจกต์ของเพื่อน (วางที่ /etc/nginx/conf.d/friend.conf)
# ==============================================================================
server {
    listen 80;
    # ⚠️ เปลี่ยนเป็นโดเมนจริงของเพื่อน เช่น app2.dogaomshoo.online หรือ myfriendapp.com
    server_name YOUR_FRIEND_DOMAIN.com;

    location / {
        # ส่งทราฟฟิกไปยังคอนเทนเนอร์ของเพื่อนที่พอร์ต 3002
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
